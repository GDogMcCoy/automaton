# Logrotate configuration for Conway Automaton
# Install: sudo cp automaton-logrotate.conf /etc/logrotate.d/automaton
#
# When running under systemd, logs go to journald by default.
# This config handles the case where logs are redirected to files.

/var/log/automaton/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 automaton automaton
    sharedscripts
    postrotate
        systemctl kill --signal=HUP automaton.service 2>/dev/null || true
    endscript
}

/var/log/automaton/*.json {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 automaton automaton
    sharedscripts
    postrotate
        systemctl kill --signal=HUP automaton.service 2>/dev/null || true
    endscript
}
